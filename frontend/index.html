    <!--
      DIRECTION CONTRACT — 校樣間 / The Proof Sheet

      THESIS: This app is a proof sheet still in the editor's hands: data is
      typeset, never packed into cards. It refuses this category's fixed
      arrangement — card grid, big number, trend badge, one brand accent.

      OWN-WORLD: Newsprint warm white, lead-type black, 朱批 vermilion for the
      editor's hand, 藍鉛筆 blue for the system's own notes. Column rules
      instead of card borders. Chinese emphasis dots (著重號) instead of
      highlight fills. Song for headings, Franklin for text and figures.
      Dark mode is the negative plate, not a dimmed page.

      STORY: The reader gets one plain-language finding first, follows the
      column rules down through the evidence, and can pull any figure out into
      a marginal note that shows the raw danmaku, comment, or video behind it.

      FIRST VIEWPORT: A masthead under a heavy rule — UID, uploader, date span,
      video count. Directly beneath, a lede sentence with its key figures marked
      by emphasis dots. To its right, one continuous ink line of the views
      record running the full measure. Below, dense ruled columns.

      FORM: Chinese newspaper typesetting and editor's proof marks; candidate 6
      of the grounded list; seed key e8b25f03.

      FINISH: unreviewed and undocumented is unfinished; this build ends with
      the finish review, the verdict, DESIGN.md, and every shipping raster
      carrying its provenance.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
